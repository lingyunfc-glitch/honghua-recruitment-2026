name: Sync public recruitment data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-recruitment-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download public data
        env:
          DATA_URL: https://api.zhangxiaolei.top/api/recruitment
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --user-agent "Mozilla/5.0 GitHub-Actions recruitment-sync" \
            "$DATA_URL" --output data.download.json

      - name: Validate and remove private fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("data.download.json").read_text(encoding="utf-8"))
          items = source.get("items")
          if not isinstance(items, list) or len(items) != 18:
              raise SystemExit("Unexpected recruitment data")
          for item in items:
              item["candidateNames"] = None
          payload = {"items": items, "canEdit": False}
          Path("data.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          rm data.download.json

      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "Sync public recruitment data"
            git push
          fi
